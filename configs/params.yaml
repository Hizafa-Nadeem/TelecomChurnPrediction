# Pipeline parameters. Plain key: value, 2-space indent; validated by src/churn/config.py.
# Paths are passed to each stage as arguments and are not stored here.
seed: 42

data:
  openml_id: 40701
  target: class
  id_column: phone_number

split:
  test_size: 0.2
  cv_folds: 5
  cv_repeats: 3

train:
  catboost_iterations: 1000
  logreg_c_grid: [0.01, 0.1, 1, 10, 100]

# 30 trials: with 4 tuned parameters most of the gain comes early, and a CatBoost CV trial is slow on CPU.
tune:
  n_trials: 30
  cv_folds: 5
  cv_repeats: 1
